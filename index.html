/* Layout concept: one phone-width column, navy hero on Home, quiet white cards elsewhere, raised "+" in the bottom bar. */
:root {
  --bg: #F3F6FC;
  --surface: #FFFFFF;
  --surface2: #EBF0FA;
  --ink: #0D1B3E;
  --muted: #55627F;
  --line: #D9E1F0;
  --brand: #2150E0;
  --brand-ink: #FFFFFF;
  --brand-soft: #E1EAFF;
  --good: #0F7A55;
  --good-soft: #D9F3E8;
  --warn: #9A5A06;
  --warn-soft: #FFEFD0;
  --bad: #B8322A;
  --bad-soft: #FCE3E0;
  --hero-a: #0A1A3F;
  --hero-b: #16357A;
  --hero-ink: #FFFFFF;
  --hero-mute: #B7C5EA;
  --scrim: rgba(8, 16, 38, .5);
  --shadow: 0 8px 24px rgba(13, 27, 62, .10);
  --font: 'IBM Plex Sans Arabic', system-ui, 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080F22; --surface: #101A33; --surface2: #18264A; --ink: #E8EEFF; --muted: #9DABCF; --line: #24345E;
    --brand: #6B96FF; --brand-ink: #07112B; --brand-soft: #1B2D60;
    --good: #4BDC9D; --good-soft: #0E3A2C; --warn: #F2B258; --warn-soft: #43300F; --bad: #FF8A80; --bad-soft: #4A1D1A;
    --hero-a: #0B1A42; --hero-b: #1B3C8C; --scrim: rgba(0, 0, 0, .62); --shadow: 0 8px 24px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080F22; --surface: #101A33; --surface2: #18264A; --ink: #E8EEFF; --muted: #9DABCF; --line: #24345E;
  --brand: #6B96FF; --brand-ink: #07112B; --brand-soft: #1B2D60;
  --good: #4BDC9D; --good-soft: #0E3A2C; --warn: #F2B258; --warn-soft: #43300F; --bad: #FF8A80; --bad-soft: #4A1D1A;
  --hero-a: #0B1A42; --hero-b: #1B3C8C; --scrim: rgba(0, 0, 0, .62); --shadow: 0 8px 24px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); }
bdi { unicode-bidi: isolate; }
.ic { width: 22px; height: 22px; flex: none; }
.ic.sm { width: 18px; height: 18px; }
.ic.lg { width: 28px; height: 28px; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }

#app { max-width: 520px; margin-inline: auto; padding-inline: 16px; padding-block: 12px 110px; min-height: 100vh; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 22px; line-height: 1.3; text-wrap: balance; }
h2 { font-size: 17px; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.gap { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec { font-size: 14px; font-weight: 600; color: var(--muted); margin-top: 6px; }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; padding-block: 8px 12px; min-height: 56px; }
.top h1 { flex: 1; min-width: 0; font-size: 20px; }
.iconbtn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); flex: none; }
.iconbtn.plain { border-color: transparent; background: transparent; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.card.flush { padding: 0; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; width: 100%; background: none; border: 0; text-align: start; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
button.row:active { background: var(--surface2); }
.avatar { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); flex: none; font-weight: 700; }
.avatar.good { background: var(--good-soft); color: var(--good); }
.avatar.warn { background: var(--warn-soft); color: var(--warn); }
.avatar.bad { background: var(--bad-soft); color: var(--bad); }
.avatar.mute { background: var(--surface2); color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--brand-soft); color: var(--brand); }

/* buttons */
.btn { min-height: 48px; padding: 10px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.danger { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.btn.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 6px 14px; font-size: 14px; border-radius: 12px; }
.btn[disabled] { opacity: .5; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btnrow > .btn { flex: 1 1 140px; }

/* tabs */
.seg { display: flex; gap: 4px; background: var(--surface2); border-radius: 14px; padding: 4px; }
.seg button { flex: 1; min-height: 40px; border: 0; background: transparent; border-radius: 10px; font-weight: 600; color: var(--muted); padding-inline: 8px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 2px; scrollbar-width: none; }
.chip { flex: none; min-height: 38px; padding: 4px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; color: var(--muted); }
.chip.on { background: var(--brand-soft); color: var(--brand); border-color: transparent; font-weight: 700; }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.in, select.in, textarea.in { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
textarea.in { min-height: 110px; resize: vertical; }
.in::placeholder { color: var(--muted); opacity: .8; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.formerr { color: var(--bad); font-size: 13px; min-height: 0; }
.formerr:empty { display: none; }
.search { position: relative; }
.search .ic { position: absolute; inset-inline-start: 14px; top: 13px; color: var(--muted); }
.search .in { padding-inline-start: 44px; }

/* hero */
.hero { background: linear-gradient(160deg, var(--hero-a), var(--hero-b)); color: var(--hero-ink); border-radius: 24px; padding: 20px 18px 18px; }
.hero h1 { color: var(--hero-ink); }
.hero .sub { color: var(--hero-mute); }
.ask { display: flex; gap: 8px; margin-top: 16px; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .22); border-radius: 16px; padding: 6px; }
.ask input { flex: 1; min-width: 0; background: transparent; border: 0; color: #fff; padding: 8px 10px; font-size: 16px; }
.ask input::placeholder { color: var(--hero-mute); }
.ask input:focus-visible { outline: none; }
.ask:focus-within { border-color: #fff; }
.ask button { width: 46px; border: 0; border-radius: 12px; background: #fff; color: #0A1A3F; display: grid; place-items: center; flex: none; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(255, 255, 255, .16); color: var(--hero-ink); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; text-align: start; display: flex; flex-direction: column; gap: 10px; min-height: 108px; }
.tile:active { background: var(--surface2); }
.tile b { font-size: 16px; }

.banner { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.banner.info { background: var(--brand-soft); color: var(--brand); }
.banner .btn { margin-top: 6px; }

/* bottom nav */
.nav { position: fixed; inset-inline: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 520px; margin-inline: auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; padding-inline: 8px; }
.nav button { background: none; border: 0; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 12px; font-weight: 500; position: relative; }
.nav button.on { color: var(--brand); font-weight: 700; }
.nav .plus { width: 56px; height: 56px; min-height: 56px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); margin: -18px auto 4px; box-shadow: var(--shadow); }
.dot { position: absolute; top: 8px; inset-inline-start: calc(50% + 6px); min-width: 18px; height: 18px; padding-inline: 5px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }

/* sheet + toast */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.sheet { position: fixed; inset-inline: 0; bottom: 0; z-index: 41; max-width: 520px; margin-inline: auto; background: var(--surface); border-radius: 24px 24px 0 0; max-height: 90vh; overflow-y: auto; padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); animation: up .22s ease-out; }
.sheet h2 { margin-bottom: 14px; }
.grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: -6px auto 14px; }
#toast { position: fixed; inset-inline: 16px; bottom: 96px; z-index: 60; max-width: 420px; margin-inline: auto; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; text-align: center; font-weight: 600; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s; }
#toast.show { opacity: 1; transform: none; }
@keyframes up { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* wizard */
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; font-weight: 600; text-align: start; }
.opt.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.opt .ic { color: var(--muted); }
.opt.on .ic { color: var(--brand); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; opacity: 0; animation: appear .35s ease-out forwards; }
.steps .tick { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--good-soft); color: var(--good); flex: none; margin-top: 1px; }
.steps .tick.warn { background: var(--warn-soft); color: var(--warn); }
.msg { white-space: pre-wrap; background: var(--surface2); border-radius: 14px; padding: 14px; font-size: 15px; line-height: 1.8; user-select: text; }
.plan { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.plan li { display: flex; gap: 10px; align-items: flex-start; }
.plan .ic { color: var(--good); margin-top: 3px; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .h { font-size: 12px; color: var(--muted); padding-block: 4px; }
.cal button { min-height: 44px; border: 0; border-radius: 12px; background: transparent; font-weight: 500; position: relative; }
.cal button.today { color: var(--brand); font-weight: 700; }
.cal button.sel { background: var(--brand); color: var(--brand-ink); }
.cal button.has::after { content: ""; position: absolute; bottom: 5px; inset-inline: 0; margin-inline: auto; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.cal button.off { visibility: hidden; }

/* report */
.kpis { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.kpi { background: var(--surface2); border-radius: 14px; padding: 10px; }
.kpi b { display: block; font-size: 15px; word-break: break-word; }
.bars svg { width: 100%; height: auto; display: block; }
.bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; }

.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .ic { width: 36px; height: 36px; opacity: .6; }
.welcome { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding-block: 24px; }
.logo { width: 76px; height: 76px; border-radius: 22px; background: linear-gradient(150deg, var(--hero-b), var(--brand)); color: #fff; display: grid; place-items: center; }

@media (max-width: 380px) { .kpis { grid-template-columns: 1fr 1fr; } .two { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) {
  .steps li { animation: none; opacity: 1; }
  .sheet { animation: none; }
  #toast { transition: none; }
}

/* ===== bilingual / direction ===== */
.langbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; }
.hero .langbtn { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.28); color: #fff; }
.mirror { transform: scaleX(-1); }
html[dir=ltr] .i-back, html[dir=ltr] .i-chev { transform: scaleX(-1); }
html[dir=ltr] .nav .dot { inset-inline-start: calc(50% + 6px); }

/* photos */
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumbs:empty { display: none; }
.thumb { width: 72px; height: 72px; padding: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--surface2); display: grid; place-items: center; color: var(--muted); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pv { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .94); display: flex; flex-direction: column; color: #fff; }
.pv-bar { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; }
.pv-bar .iconbtn { color: #fff; border-color: rgba(255, 255, 255, .3); background: transparent; }
.pv-body { flex: 1; display: grid; place-items: center; padding: 8px; min-height: 0; }
.pv-body img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
.pin { text-align: center; font-size: 24px; letter-spacing: .4em; }

</style>

  }
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('blob'))), 'image/jpeg', q));

}

async function phMount() {

  const t = root.dataset.pt, id = root.dataset.pid; const ids = phIds(t, id).slice(); const box = root.querySelector('[data-thumbs]'); const out = [];
  for (const pid of ids) {
    let rec = null; try { rec = await PH.get(pid); } catch (e) { /* missing */ }
    if (rec && rec.blob) { const u = URL.createObjectURL(rec.blob); PH.urls.push(u); out.push(`<button type="button" class="thumb" data-act="phView" data-pt="${t}" data-pid="${esc(id)}" data-ph="${pid}" aria-label="${tr('عرض الصورة', 'View photo')}"><img src="${u}" alt=""></button>`); }
    else out.push(`<button type="button" class="thumb miss" data-act="phView" data-pt="${t}" data-pid="${esc(id)}" data-ph="${pid}" aria-label="${tr('صورة غير موجودة', 'Photo not found')}">${ic('image')}</button>`);

async function phPick(input) {
  const wrap = input.closest('.photos'); const t = wrap.dataset.pt, id = wrap.dataset.pid; const files = [...input.files]; input.value = '';

}

    sheet(`<div class="grab"></div><h2>${tr('تصدير الفواتير', 'Export invoices')}</h2><p class="small muted" style="margin-bottom:10px">${tr('انسخ النص والصقه في ملف نصي أو جدول (Excel / Google Sheets).', 'Copy the text and paste it into a text file or a spreadsheet (Excel / Google Sheets).')}</p><textarea class="in" id="b-text" readonly style="min-height:160px;direction:ltr;font-size:12px">${esc(rows.join('\n'))}</textarea><div class="btnrow" style="margin-top:12px"><button class="btn primary" data-act="copyBackup">${ic('copy', 'sm')} ${tr('نسخ', 'Copy')}</button><button class="btn" data-act="closeSheet">${tr('إغلاق', 'Close')}</button></div>`);
  },
};

async function hashPin(p) {
  const s = 'tm1:' + p;
  try { if (window.crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join(''); } } catch (e) { /* fall back */ }
  let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return 'f' + h;
}
const backupOf = (x) => { const o = Object.assign({}, x); delete o.lock; return o; };
const pinOk = (p) => /^\d{4,6}$/.test(p);
let pinFails = 0, pinWait = 0;
const SUBMIT = {
  unlock: async (f) => {
    if (Date.now() < pinWait) return formFail(f, 'lk-pin', tr('محاولات كثيرة. انتظر قليلاً ثم حاول مجدداً.', 'Too many attempts. Wait a moment and try again.'));
    const pin = normDigits(val('lk-pin'));
    if (pin && (await hashPin(pin)) === S.lock.h) { pinFails = 0; LOCKED = false; render(true); return; }
    pinFails++; if (pinFails >= 5) { pinFails = 0; pinWait = Date.now() + 30000; }
    const el = document.getElementById('lk-pin'); if (el) el.value = ''; formFail(f, 'lk-pin', tr('الرقم غير صحيح.', 'Incorrect PIN.'));
  },
  pinSave: async (f) => {
    if (S.lock.on && (await hashPin(normDigits(val('pn-old')))) !== S.lock.h) return formFail(f, 'pn-old', tr('الرقم الحالي غير صحيح.', 'The current PIN is incorrect.'));
    const a = normDigits(val('pn-new')), b = normDigits(val('pn-new2'));
    if (!pinOk(a)) return formFail(f, 'pn-new', tr('الرقم السري من 4 إلى 6 أرقام.', 'The PIN must be 4 to 6 digits.'));
    if (a !== b) return formFail(f, 'pn-new2', tr('الرقمان غير متطابقين.', 'The two PINs do not match.'));
    S.lock = { on: true, h: await hashPin(a) }; closeSheet(); commit(tr('تم تفعيل القفل', 'App lock is on'));
  },
  pinOffDo: async (f) => {
    if ((await hashPin(normDigits(val('pf-pin')))) !== S.lock.h) return formFail(f, 'pf-pin', tr('الرقم غير صحيح.', 'Incorrect PIN.'));
    S.lock = { on: false, h: '' }; closeSheet(); commit(tr('تم إيقاف القفل', 'App lock is off'));
  },
  obStart: () => { S.profile.name = val('ob-name'); loadSample(); S.onboarded = true; save(); V = { name: 'home', p: {}, stack: [] }; render(true); },
  ask: () => { const t = val('ask-in'); if (t.length < 2) { toast(tr('اكتب طلبك أولاً', 'Type your request first')); return; } W = guess(t); go('taskNew'); },
  wNext: (f) => {
    captureW();
    if (W.type !== 'invoice' && W.text.length < 2) return formFail(f, 'w-text', tr('اكتب ما تريد إنجازه.', 'Write what you want to get done.'));
    if (W.type === 'followup' && !W.clientId) return formFail(f, 'w-client', S.clients.length ? tr('اختر العميل.', 'Choose the client.') : tr('أضف عميلاً أولاً من صفحة العملاء.', 'Add a client first from the Clients page.'));
    if (W.type === 'appt') { if (!validDate(W.date)) return formFail(f, 'w-date', tr('اختر تاريخ الموعد.', 'Choose the appointment date.')); if (!/^\d{2}:\d{2}$/.test(W.time)) return formFail(f, 'w-time', tr('اختر وقت الموعد.', 'Choose the appointment time.')); }
    if (W.type === 'invoice') { if (!W.invoiceId) return formFail(f, 'w-invoice', tr('اختر الفاتورة.', 'Choose the invoice.')); if (W.action === 'remind' && !validDate(W.remindOn)) return formFail(f, 'w-remind', tr('اختر تاريخ التذكير.', 'Choose the reminder date.')); }
    go('taskPlan');
  },
  saveInvoice: (f) => {
    const id = f.dataset.id; const dir = val('i-dir'); const amount = toNum(val('i-amount')); const due = val('i-due');
    const clientId = dir === 'in' ? val('i-client') : ''; const party = val('i-party');
    if (!clientId && !party) return formFail(f, 'i-party', tr('اكتب اسم الجهة أو اختر عميلاً.', 'Enter a payee name or choose a client.'));
    if (!(amount > 0)) return formFail(f, 'i-amount', tr('أدخل مبلغاً أكبر من صفر.', 'Enter an amount greater than zero.'));
    if (!validDate(due)) return formFail(f, 'i-due', tr('اختر تاريخ استحقاق صحيحاً.', 'Choose a valid due date.'));
    const num = parseInt(toNum(val('i-num')), 10) || S.seq + 1; const paid = $('#i-paid').checked;
    const data = { dir, clientId, party: clientId ? '' : party, title: val('i-title'), amount, cur: val('i-cur'), number: num, due, category: dir === 'out' ? val('i-cat') : '' };
    const i = id ? byId(S.invoices, id) : null;
    if (i) { const was = i.status === 'paid'; Object.assign(i, data); i.status = paid ? 'paid' : 'unpaid'; i.paidAt = paid ? (was ? i.paidAt : today()) : ''; }
    else { S.invoices.push(Object.assign({ id: uid(), status: paid ? 'paid' : 'unpaid', paidAt: paid ? today() : '', photos: PH.pending.slice() }, data)); PH.pending = []; }
    S.seq = Math.max(S.seq, num); closeSheet(); commit(tr('تم حفظ الفاتورة', 'Invoice saved'));
  },
  saveClient: (f) => {
    const name = val('c-name'); if (name.length < 2) return formFail(f, 'c-name', tr('اكتب اسم العميل.', 'Enter the client name.'));
    const data = { name, phone: val('c-phone'), email: val('c-email'), note: val('c-note') }; const c = f.dataset.id ? byId(S.clients, f.dataset.id) : null;
    if (c) Object.assign(c, data); else S.clients.push(Object.assign({ id: uid() }, data));
    closeSheet(); commit(tr('تم حفظ العميل', 'Client saved'));
  },
  saveAppt: (f) => {
    const title = val('a-title'), date = val('a-date'), time = val('a-time');
    if (title.length < 2) return formFail(f, 'a-title', tr('اكتب عنوان الموعد.', 'Enter a title.')); if (!validDate(date)) return formFail(f, 'a-date', tr('اختر التاريخ.', 'Choose a date.')); if (!/^\d{2}:\d{2}$/.test(time)) return formFail(f, 'a-time', tr('اختر الوقت.', 'Choose a time.'));
    const data = { title, date, time, clientId: val('a-client'), note: val('a-note') }; const a = f.dataset.id ? byId(S.appts, f.dataset.id) : null;
    if (a) Object.assign(a, data); else S.appts.push(Object.assign({ id: uid() }, data));
    V.p.day = date; V.p.ym = date.slice(0, 7); closeSheet(); commit(tr('تم حفظ الموعد', 'Appointment saved'));
  },
  saveSub: (f) => {
    const name = val('s-name'), price = toNum(val('s-price')), next = val('s-next');
    if (name.length < 2) return formFail(f, 's-name', tr('اكتب اسم الاشتراك.', 'Enter the subscription name.')); if (!(price > 0)) return formFail(f, 's-price', tr('أدخل سعراً أكبر من صفر.', 'Enter a price greater than zero.')); if (!validDate(next)) return formFail(f, 's-next', tr('اختر تاريخ التجديد.', 'Choose the renewal date.'));
    const data = { name, price, cur: val('s-cur'), cycle: val('s-cycle'), next, category: val('s-cat'), active: $('#s-active').checked }; const s = f.dataset.id ? byId(S.subs, f.dataset.id) : null;
    if (s) Object.assign(s, data); else S.subs.push(Object.assign({ id: uid() }, data));
    closeSheet(); commit(tr('تم حفظ الاشتراك', 'Subscription saved'));
  },
  saveDoc: (f) => {
    const title = val('d-title'), exp = val('d-exp');
    if (title.length < 2) return formFail(f, 'd-title', tr('اكتب اسم المستند.', 'Enter the document name.')); if (exp && !validDate(exp)) return formFail(f, 'd-exp', tr('تاريخ الانتهاء غير صحيح.', 'The expiry date is not valid.'));
    const data = { title, category: val('d-cat'), clientId: val('d-client'), expiry: exp, note: val('d-note') }; const d = f.dataset.id ? byId(S.docs, f.dataset.id) : null;
    if (d) Object.assign(d, data); else { S.docs.push(Object.assign({ id: uid(), photos: PH.pending.slice() }, data)); PH.pending = []; }
    closeSheet(); commit(tr('تم حفظ المستند', 'Document saved'));
  },
  saveProfile: () => {
    S.profile.name = val('p-name'); S.profile.business = val('p-biz'); S.profile.cur = val('p-cur'); S.profile.cc = val('p-cc').replace(/\D/g, '') || '963'; commit(tr('تم الحفظ', 'Saved'));
  },
};

document.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (!el) return; const fn = ACT[el.dataset.act]; if (fn) fn(el, e); });
document.addEventListener('submit', (e) => { const f = e.target.closest('[data-submit]'); if (!f) return; e.preventDefault(); const fn = SUBMIT[f.dataset.submit]; if (fn) fn(f); });
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.input; if (!k) return;
  V.p.q = e.target.value.trim(); const box = $('#list'); const fn = LISTS[V.name]; if (box && fn) box.innerHTML = fn();
});
document.addEventListener('change', (e) => { if (e.target.id === 'w-action') { captureW(); render(false); } const c = e.target.closest && e.target.closest('[data-change]'); if (c && c.dataset.change === 'phPick') phPick(c); });

document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; const pv = document.querySelector('.pv'); if (pv) { phClose(); return; } if (sheetRoot.firstChild) closeSheet(); });

let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (!S.lock || !S.lock.on) return;
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 30000 && !LOCKED) { LOCKED = true; closeSheet(); phClose(); render(false); }
});

render(true);

})();
</script>
